---
permalink: /fossil
root: ./projects/fossil
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="{{ page.root }}/vite.svg" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Fossil</title>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

			body {
        background-color: #141414;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }

      #wrapper {
        position: relative;
        flex: 1 1 auto;
        width: 100%;
        height: auto;
        min-height: 0;
        /* background-color: #601414; */
        /* overflow: hidden; */
			}

      #my_canvas {
        max-width: 100%;
        max-height: 100%;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);

        /* box-sizing: border-box; */
        border: gray 1px solid;
      }

      button {
        width: 40px;
        height: 40px;
        border-radius: 6px;
        border: none;
        background: #6E6D70;
        color: #DFDEDF;
        user-select: none;
        font-size: 16px;
      }

      button.look-button {
        width: 70px;
        font-size: 12px;
      }

      button.look-button.active {
        background: #D2D0CA;
        color: #272825;
        box-shadow: 0 0 0 2px #4E514A inset;
      }

      #devControls {
        position: relative;
        flex: 0 0 auto;
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px max(10px, env(safe-area-inset-bottom));
        background: #141414;
        border-top: 1px solid #30302f;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px 16px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 100%;
      }

      .control-row {
        display: flex;
        gap: 10px;
      }

      #settingsPanel { display: contents; }
      #settingsMenuBtn { display: none; }

      .menu-icon {
        display: block;
        width: 18px;
        height: 2px;
        background: currentColor;
        box-shadow: 0 -6px currentColor, 0 6px currentColor;
      }

      .navigation-controls {
        margin-left: auto;
        flex-shrink: 0;
      }

      #exportVideoBtn { width: 112px; font-size: 12px; }
      #videoExportStatus { position: static; width: 100%; margin: 0; font-size: 12px; color: #c6c6c6; overflow-wrap: anywhere; text-align: center; }
      #videoExportStatus a { color: #e8dcc2; }

      @media (max-width: 700px), (hover: none), (pointer: coarse) {
        #exportVideoBtn, #videoExportStatus { display: none; }
      }

      button.sampling-button {
        width: 100px;
        font-size: 12px;
      }

      button.composition-button {
        width: 65px;
        font-size: 12px;
      }

      button.composition-button.active {
        background: #CBC4AD;
        color: #302C21;
        box-shadow: 0 0 0 2px #625941 inset;
      }

      button.sampling-button.active {
        background: #BFC8B8;
        color: #252A22;
        box-shadow: 0 0 0 2px #495542 inset;
      }

      button.debug-toggle-button.active {
        background: #B9C6D8;
        color: #222831;
        box-shadow: 0 0 0 2px #46566D inset;
      }

      button.effect-toggle-button {
        width: 70px;
        font-size: 12px;
      }

      button.effect-toggle-button.active {
        background: #D4BFCB;
        color: #30252B;
        box-shadow: 0 0 0 2px #684D5D inset;
      }

      #prevBtn,
      #repeatBtn,
      #nextBtn {
        font-size: 24px;
      }

      #prevBtn,
      #nextBtn {
        padding-bottom: 4px;
      }

      @media (max-width: 700px) {
        #my_canvas {
          box-sizing: border-box;
        }

        body {
          display: flex;
          flex-direction: column;
          height: 100dvh;
        }

        #wrapper {
          position: relative;
          flex: 1 1 auto;
          width: 100%;
          height: auto;
          min-height: 0;
        }

        button {
          width: 30px;
          height: 30px;
          border-radius: 5px;
          font-size: 12px;
        }

        button.look-button {
          width: 53px;
          font-size: 9px;
        }

        #devControls {
          padding: 6px max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
        }

        #settingsMenuBtn {
          display: grid;
          place-items: center;
          width: 40px;
          height: 40px;
          flex-shrink: 0;
        }

        #settingsMenuBtn[aria-expanded="true"] {
          background: #D2D0CA;
          color: #272825;
        }

        #settingsMenuBtn[aria-expanded="true"] .menu-icon {
          height: auto;
          background: none;
          box-shadow: none;
          font-size: 26px;
          line-height: 1;
        }

        #settingsMenuBtn[aria-expanded="true"] .menu-icon::before { content: "×"; }

        #settingsPanel {
          display: none;
          order: -1;
          flex: 0 0 100%;
          max-height: 45dvh;
          overflow-y: auto;
          overscroll-behavior: contain;
          padding-bottom: 8px;
          border-bottom: 1px solid #30302f;
        }

        #devControls.settings-open #settingsPanel {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        #settingsPanel .control-row { flex-wrap: wrap; }

        .control-row {
			gap: 8px;
        }

        .navigation-controls {
          margin-left: auto;
          gap: 6px;
        }

        #prevBtn,
        #repeatBtn,
        #nextBtn {
          width: 40px;
          height: 40px;
        }

        #replayBtn {
          width: 56px;
          height: 40px;
          font-size: 11px;
        }

        #nextBtn {
          background: #858489;
          box-shadow: 0 0 0 2px #B4B2B7 inset;
        }

        button.sampling-button {
			width: 75px;
			font-size: 9px;
        }

        button.effect-toggle-button {
			width: 53px;
			font-size: 9px;
        }

        button.composition-button {
          width: 52px;
          font-size: 10px;
        }

        #prevBtn,
        #repeatBtn,
        #nextBtn {
			font-size: 18px;
        }

        #prevBtn,
        #nextBtn {
			padding-bottom: 3px;
        }
      }

      p {
        position: absolute;
        top: 10px;
        right: 20px;
        margin-left: 10px;
        text-align: right;
        color: white;
        text-shadow: black 2px 2px 2px;
        background-color: #00000060;
        user-select: none;
      }

      #debugText {
        display: none;
      }

      .animation-status {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #e2d7c5;
        font: 12px system-ui, sans-serif;
        pointer-events: none;
      }

      .animation-status[hidden] { display: none; }
      a.effect-toggle-button { display: grid; place-items: center; width: 90px; height: 40px; border-radius: 6px; background: #6E6D70; color: #DFDEDF; font: 12px system-ui,sans-serif; text-decoration: none; }
      a.effect-toggle-button[hidden] { display: none; }
      @media (min-width: 701px) {
        #devControls {
          padding: 5px 6px max(5px, env(safe-area-inset-bottom));
          gap: 5px 8px;
        }

        #settingsPanel .control-row { gap: 5px; }

        #settingsPanel button {
          width: 20px;
          height: 20px;
          border-radius: 3px;
          font-size: 9px;
        }

        #settingsPanel button.look-button,
        #settingsPanel button.effect-toggle-button {
          width: 35px;
          font-size: 7px;
        }

        #settingsPanel button.sampling-button { width: 50px; font-size: 7px; }
        #settingsPanel button.composition-button { width: 32.5px; font-size: 7px; }
        #settingsPanel #exportVideoBtn { width: 56px; font-size: 7px; }
        #settingsPanel a.effect-toggle-button {
          width: 45px;
          height: 20px;
          border-radius: 3px;
          font-size: 7px;
        }
      }
      @media (max-width: 700px) { a.effect-toggle-button {height:30px;font-size:10px;width:78px} }
      body.animation-preview #devControls, body.animation-preview > p { display: none; }
      body.animation-preview #my_canvas { border: 0; }
      .animation-status.error { padding: 10px 14px; background: #161616e6; }
      .fossil-loader { width: 80px; height: 80px; position: relative; animation: fossil-orbit 6s linear infinite; }
      .fossil-loader i {
        position: absolute;
        left: 50%; top: 50%;
        width: 4px; height: 4px;
        margin: -2px;
        border-radius: 50%;
        background: #e2d7c5;
        transform: translate(var(--x), var(--y));
        animation: fossil-pulse 1.6s ease-in-out infinite;
        animation-delay: calc(var(--i) * -0.11s);
      }
      @keyframes fossil-orbit { to { transform: rotate(360deg); } }
      @keyframes fossil-pulse {
        0%, 100% { opacity: .18; scale: .65; }
        50% { opacity: 1; scale: 1.4; }
      }

		</style>
    <script type="module" crossorigin src="{{ page.root }}/index.js"></script>
  </head>
  <body>
    <div id="wrapper">
      <canvas id="my_canvas" ></canvas>
    </div>
    <!-- <script type="module" src="{{ page.root }}/src/tests/arc-collision-test.js"></script> -->
    <!-- <script type="module" src="{{ page.root }}/src/tests/point-polygon-test.js"></script> -->
    <div id="devControls">
      <button id="settingsMenuBtn" type="button" aria-label="Open settings" aria-controls="settingsPanel" aria-expanded="false" title="Open settings">
        <span class="menu-icon" aria-hidden="true"></span>
      </button>
      <div id="settingsPanel" role="group" aria-label="Drawing settings">
      <div class="control-row">
        <button id="debugBtn" class="debug-toggle-button" title="Toggle debug drawing">Deb</button>
        <button id="colorsBtn" class="debug-toggle-button" title="Toggle debug colours">Col</button>
        <button id="soloBtn" hidden>Solo</button>
        <button id="look1Btn" class="look-button" hidden>Base</button>
        <button id="look2Btn" class="look-button" hidden>Dense</button>
        <button id="look3Btn" class="look-button" hidden>Aniso</button>
      </div>
      <div class="control-row">
        <button id="samplingLegacyBtn" class="sampling-button" title="Sampling: legacy" hidden>Sampl Legacy</button>
        <button id="samplingAnisotropicBtn" class="sampling-button" title="Sampling: anisotropic" hidden>Sampl Aniso</button>
        <button id="samplingRandomBtn" class="sampling-button" title="Sampling: seeded random" hidden>Sampl Random</button>
      </div>
      <div class="control-row" aria-label="Composition">
        <button id="compositionAutoBtn" class="composition-button" title="Seeded composition: 20% single, 20% double, 10% triple, 50% packed" hidden>Auto</button>
        <button id="compositionPackedBtn" class="composition-button" title="Multiple packed worms" hidden>Packed</button>
        <button id="compositionSingleBtn" class="composition-button" title="One large worm" hidden>Single</button>
        <button id="compositionDoubleBtn" class="composition-button" title="Exactly two worms" hidden>Double</button>
        <button id="compositionTripleBtn" class="composition-button" title="Exactly three worms" hidden>Triple</button>
      </div>
      <div class="control-row" role="group" aria-label="Rock background">
        <button id="rockOffBtn" class="effect-toggle-button" title="Wyłącz tło skały" hidden>Rock Off</button>
        <button id="rock1Btn" class="effect-toggle-button" title="Głębokie szczeliny" hidden>Rock 1</button>
        <button id="rock2Btn" class="effect-toggle-button" title="Starta powierzchnia" hidden>Rock 2</button>
        <button id="rock3Btn" class="effect-toggle-button" title="Kruchy łupek" hidden>Rock 3</button>
        <button id="rockRandomBtn" class="effect-toggle-button" title="Rodzaj skały losowany z seeda" hidden>Rock Random</button>
      </div>
      <div class="control-row">
		<button id="dispersionBtn" class="effect-toggle-button" title="Toggle final-dot dispersion" hidden>Disp</button>
		<button id="snapBtn" class="effect-toggle-button" title="Snap final dots to a 0.3-unit grid with 0.05 jitter" hidden>Snap</button>
        <button id="whiteBackgroundBtn" class="effect-toggle-button" title="Match the exterior background to the light stone colour" hidden>Light BG</button>
        <button id="exportVideoBtn" title="Export video locally with FFmpeg" hidden disabled>Export video</button>
      </div>
      <p id="videoExportStatus" role="status" hidden></p>
      </div>
      <div class="control-row navigation-controls" role="group" aria-label="Playback and seed navigation">
        <button id="repeatBtn" title="Repeat current seed">↻</button>
        <button id="replayBtn" class="effect-toggle-button" title="Replay the cached animation" hidden>Replay</button>
        <button id="prevBtn" title="Previous seed">⇇</button>
        <button id="nextBtn" title="Next seed">⇉</button>
      </div>
    </div>
    <p id="debugText">debug data</p>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Fossil</title>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

			body {
        background-color: #141414;
				height: 100%;
        overflow: hidden;
      }

      #wrapper {
        width: 100vw;
        height: 100vh;
        /* background-color: #601414; */
        /* overflow: hidden; */
			}

      #my_canvas {
        max-width: 100%;
        max-height: 100%;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);

        /* box-sizing: border-box; */
        border: gray 1px solid;
      }

      button {
        width: 40px;
        height: 40px;
        border-radius: 6px;
        border: none;
        background: #6E6D70;
        color: #DFDEDF;
        user-select: none;
        font-size: 16px;
      }

      button.look-button {
        width: 70px;
        font-size: 12px;
      }

      button.look-button.active {
        background: #D2D0CA;
        color: #272825;
        box-shadow: 0 0 0 2px #4E514A inset;
      }

      #devControls {
        position: absolute;
        bottom: 10px;
        left: 10px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 20px;
      }

      .control-row {
        display: flex;
        gap: 10px;
      }

      button.sampling-button {
        width: 100px;
        font-size: 12px;
      }

      button.sampling-button.active {
        background: #BFC8B8;
        color: #252A22;
        box-shadow: 0 0 0 2px #495542 inset;
      }

      button.debug-toggle-button.active {
        background: #B9C6D8;
        color: #222831;
        box-shadow: 0 0 0 2px #46566D inset;
      }

      button.effect-toggle-button {
        width: 70px;
        font-size: 12px;
      }

      button.effect-toggle-button.active {
        background: #D4BFCB;
        color: #30252B;
        box-shadow: 0 0 0 2px #684D5D inset;
      }

      #prevBtn,
      #repeatBtn,
      #nextBtn {
        font-size: 24px;
      }

      #prevBtn,
      #nextBtn {
        padding-bottom: 4px;
      }

      @media (max-width: 700px) {
        body {
          display: flex;
          flex-direction: column;
          height: 100dvh;
        }

        #wrapper {
          position: relative;
          flex: 1 1 auto;
          width: 100%;
          height: auto;
          min-height: 0;
        }

        button {
          width: 30px;
          height: 30px;
          border-radius: 5px;
          font-size: 12px;
        }

        button.look-button {
          width: 53px;
          font-size: 9px;
        }

        #devControls {
			position: relative;
			bottom: auto;
			left: auto;
			flex: 0 0 auto;
			width: 100%;
			box-sizing: border-box;
			padding: 5px 0 max(5px, env(safe-area-inset-bottom));
			background: #141414;
			flex-direction: column;
			align-items: flex-start;
			gap: 5px;
        }

        .control-row {
			gap: 8px;
        }

        .control-row:last-child {
			width: 100%;
			align-self: stretch;
			align-items: flex-start;
        }

        #prevBtn,
        #repeatBtn,
        #nextBtn {
          width: 46px;
          height: 46px;
        }

        #prevBtn {
          margin-left: auto;
        }

        #nextBtn {
          background: #858489;
          box-shadow: 0 0 0 2px #B4B2B7 inset;
        }

        button.sampling-button {
			width: 75px;
			font-size: 9px;
        }

        button.effect-toggle-button {
			width: 53px;
			font-size: 9px;
        }

        #prevBtn,
        #repeatBtn,
        #nextBtn {
			font-size: 18px;
        }

        #prevBtn,
        #nextBtn {
			padding-bottom: 3px;
        }
      }

      p {
        position: absolute;
        top: 10px;
        right: 20px;
        margin-left: 10px;
        text-align: right;
        color: white;
        text-shadow: black 2px 2px 2px;
        background-color: #00000060;
        user-select: none;
      }

      #debugText {
        display: none;
      }

		</style>
    <script type="module" crossorigin src="/index.js"></script>
  </head>
  <body>
    <div id="wrapper">
      <canvas id="my_canvas" ></canvas>
    </div>
    <!-- <script type="module" src="/src/tests/arc-collision-test.js"></script> -->
    <!-- <script type="module" src="/src/tests/point-polygon-test.js"></script> -->
    <div id="devControls">
      <div class="control-row">
        <button id="debugBtn" class="debug-toggle-button" title="Toggle debug drawing">Deb</button>
        <button id="colorsBtn" class="debug-toggle-button" title="Toggle debug colours">Col</button>
        <button id="soloBtn" hidden>Solo</button>
        <button id="look1Btn" class="look-button" hidden>1 Base</button>
        <button id="look2Btn" class="look-button" hidden>2 Dense</button>
        <button id="look3Btn" class="look-button" hidden>3 Aniso</button>
      </div>
      <div class="control-row">
        <button id="samplingLegacyBtn" class="sampling-button" title="Sampling: legacy" hidden>Sampl Legacy</button>
        <button id="samplingAnisotropicBtn" class="sampling-button" title="Sampling: anisotropic" hidden>Sampl Aniso</button>
        <button id="samplingRandomBtn" class="sampling-button" title="Sampling: seeded random" hidden>Sampl Random</button>
      </div>
      <div class="control-row">
		<button id="dispersionBtn" class="effect-toggle-button" title="Toggle final-dot dispersion" hidden>Disp</button>
		<button id="snapBtn" class="effect-toggle-button" title="Snap final dots to a 0.3-unit grid with 0.05 jitter" hidden>Snap</button>
        <button id="prevBtn" title="Previous seed">⇇</button>
        <button id="repeatBtn" title="Repeat current seed">↻</button>
        <button id="nextBtn" title="Next seed">⇉</button>
      </div>
    </div>
    <p id="debugText">debug data</p>
  </body>
</html>
